# Build and publish the client-side planet to GitHub Pages.
#
# The planet bakes in the browser, so the workflow only typechecks, scans
# shaders, and produces a static build for Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets deploy-pages mint its token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push win rather than queue behind a
# 20-minute bake that is already stale.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The planet bakes client-side, so only code/shader sanity checks and the
      # static build run in CI.
      - run: npx tsc --noEmit
      - run: npm run check:shaders

      - name: Build
        env:
          # Project site: https://<user>.github.io/<repo>/ — so the base has to
          # be /<repo>/. Derived from the repository so a fork or a rename
          # needs no edit here.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npx vite build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
