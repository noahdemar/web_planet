# Build the client-side planet and commit the static output to docs/
# on the main branch, so GitHub Pages can deploy directly from main.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race; let a newer push win rather than queue behind a
# build that is already stale.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The planet bakes client-side, so only code/shader sanity checks and the
      # static build run in CI.
      - run: npx tsc --noEmit
      - run: npm run check:shaders

      - name: Build
        env:
          # Project site: https://<user>.github.io/<repo>/ — so the base has to
          # be /<repo>/. Derived from the repository so a fork or a rename
          # needs no edit here.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npx vite build

      - name: Publish to docs/
        run: |
          rm -rf docs
          cp -r dist docs
          touch docs/.nojekyll

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to docs"
            exit 0
          fi
          git commit -m "Publish docs from main [skip ci]"
          git push
