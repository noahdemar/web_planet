<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>world_sim — M1</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; }
      canvas { display: block; }

      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
        color: #cfe3d8; background: rgba(8, 14, 12, 0.72);
        border: 1px solid rgba(120, 170, 150, 0.22);
        border-radius: 4px; padding: 10px 12px; min-width: 268px;
        backdrop-filter: blur(8px); user-select: none;
      }
      #hud h1 {
        font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
        margin: 0 0 8px; color: #6f9a86; font-weight: 600;
      }
      #hud .row { display: flex; justify-content: space-between; gap: 16px; }
      #hud .row span:last-child { color: #eaf5ef; font-variant-numeric: tabular-nums; }
      #hud .sep { height: 1px; background: rgba(120,170,150,0.18); margin: 8px 0; }
      #hud .warn { color: #e0a86a; }
      #hud .good { color: #7fc9a0; }
      #hud .hint { color: #5f7d70; font-size: 11px; margin-top: 8px; line-height: 1.6; }
      #hud kbd {
        background: rgba(120,170,150,0.14); border-radius: 3px;
        padding: 0 4px; font: inherit; color: #9dbfae;
      }

      #err {
        position: fixed; inset: 0; z-index: 100; display: none;
        align-items: center; justify-content: center; padding: 40px;
        background: #05070a; color: #e8b4a0;
        font: 13px/1.7 ui-monospace, Menlo, monospace;
      }
      #err div { max-width: 60ch; white-space: pre-wrap; }
      #err b { color: #f0d0b8; display: block; margin-bottom: 10px; font-size: 15px; }

      /* The planet is solved in the browser, and the solve is a minute of
         arithmetic — so it gets a screen rather than a frozen tab. */
      #boot {
        position: fixed; inset: 0; z-index: 90; display: flex;
        align-items: center; justify-content: center; flex-direction: column;
        gap: 18px; background: #05070a; color: #cfe3d8;
        font: 13px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
        transition: opacity 500ms ease; padding: 40px; text-align: center;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot h1 {
        font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
        color: #6f9a86; font-weight: 600; margin: 0;
      }
      #boot .bar {
        width: min(420px, 70vw); height: 2px; background: rgba(120,170,150,0.18);
        border-radius: 2px; overflow: hidden;
      }
      #boot .bar i { display: block; height: 100%; width: 0;
        background: #7fc9a0; transition: width 200ms linear; }
      #boot .note { color: #5f7d70; max-width: 52ch; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="err"><div></div></div>
    <div id="boot">
      <h1>Forming the planet</h1>
      <div class="bar"><i></i></div>
      <div class="stage">starting</div>
      <div class="note">
        Plate tectonics, then erosion and drainage over the whole sphere. This
        runs once per seed and is kept, so it only happens on a first visit.
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
